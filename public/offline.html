<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · JABARI DENTAL</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #f6f1e8; color: #211c17;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 2rem;
      }
      .card { max-width: 30rem; text-align: center; }
      .brand { letter-spacing: 0.3em; font-size: 0.8rem; color: #b08d57; text-transform: uppercase; }
      h1 { font-size: 2.6rem; line-height: 1.05; margin: 1.2rem 0; font-weight: 400; }
      p { color: #6f675c; font-family: system-ui, sans-serif; line-height: 1.7; margin-bottom: 2rem; }
      .rule { width: 3rem; height: 2px; background: #b08d57; margin: 0 auto 1.6rem; }
      a {
        display: inline-block; text-decoration: none; background: #2c4439; color: #f6f1e8;
        padding: 0.9rem 1.8rem; border-radius: 999px; font-family: system-ui, sans-serif; font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">JABARI DENTAL</div>
      <div class="rule"></div>
      <h1>You're offline.</h1>
      <p>Please reconnect to continue browsing. Your smile can wait a moment.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
