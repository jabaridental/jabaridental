# Cloudflare Workers configuration for JABARI DENTAL.
#
# This file configures the production Worker (the Astro Cloudflare adapter
# reads it via wrangler at build time). After running `wrangler login`,
# create the resources with:
#
#   wrangler d1 create jabari-dental-db        # then paste the id below
#
# Both names are stable: changing them invalidates existing production data.
name = "jabaridental"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Production observability — safe to leave on.
[observability]
enabled = true

# ---- D1 database binding --------------------------------------------------
# The application reads `env.DB` (see src/lib/platform.ts). The id below
# must match the one `wrangler d1 create` returns.
[[d1_databases]]
binding = "DB"
database_name = "jabari-dental-db"
database_id = "56b86e4d-14ad-432e-b427-d67cc3b786f2"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://media.jabaridental.com"

# Secrets (AUTH_SECRET, ADMIN_SECRET) are set via:
#   wrangler secret put AUTH_SECRET
#   wrangler secret put ADMIN_SECRET
# DO NOT commit real values.

# ---- Custom domain --------------------------------------------------------
# After the first deploy, attach the production hostname in the Cloudflare
# dashboard or via `wrangler routes add`. Two hostnames are listed; pick
# exactly one as canonical and redirect the other (see src/middleware.ts).
# routes = [
#   { pattern = "jabaridental.com/*",      custom_domain = true },
#   { pattern = "www.jabaridental.com/*",  custom_domain = true },
# ]
#
# Cron / triggers: not used.
