# Cloudflare Workers configuration for JABARI DENTAL.
#
# This file configures the production Worker (the Astro Cloudflare adapter
# reads it via wrangler at build time). After running `wrangler login`,
# create the resources with:
#
#   wrangler d1 create jabari-dental-db        # then paste the id below
#
# Both names are stable: changing them invalidates existing production data.
name = "jabaridental"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# ---- Custom domain --------------------------------------------------------
# Attached in production (via Workers custom domains). Keep these in the
# config so `wrangler deploy` in CI matches the remote state; wrangler would
# otherwise delete hostnames it doesn't know about. Both hostnames serve the
# same Worker; src/middleware.ts redirects www -> apex.
routes = [
  { pattern = "jabaridental.com", zone_name = "jabaridental.com", custom_domain = true },
  { pattern = "www.jabaridental.com", zone_name = "jabaridental.com", custom_domain = true },
]

# ---- Static assets ---------------------------------------------------------
# @astrojs/cloudflare v12 emits the Worker bundle into dist/_worker.js/ and the
# client assets (public/ + dist/_astro) directly into dist/. This block tells
# wrangler to upload dist/ as Workers Static Assets and route requests:
#   - exact matches (/_astro/*, /images/*, /favicon.ico, ...) -> asset
#   - everything else -> the SSR Worker (dist/_routes.json controls this)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = false

# Production observability — safe to leave on.
[observability]
enabled = true

# ---- D1 database binding --------------------------------------------------
# The application reads `env.DB` (see src/lib/platform.ts). The id below
# must match the one `wrangler d1 create` returns.
[[d1_databases]]
binding = "DB"
database_name = "jabari-dental-db"
database_id = "56b86e4d-14ad-432e-b427-d67cc3b786f2"

# ---- R2 media bucket binding ----------------------------------------------
# The studio uploads images here via /api/upload. R2 is a flat namespace, so
# keys are date-prefixed (uploads/YYYY/MM/<random>.<ext>). The public delivery
# URL is built from MEDIA_PUBLIC_BASE_URL — see src/lib/platform.ts and
# src/lib/media.ts. To enable R2 in a new account: dashboard → R2 → enable,
# then `wrangler r2 bucket create jabari-dental-media`.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "jabari-dental-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://media.jabaridental.com"

# Secrets (AUTH_SECRET, ADMIN_SECRET) are set via:
#   wrangler secret put AUTH_SECRET
#   wrangler secret put ADMIN_SECRET
# DO NOT commit real values.
#
# Cron / triggers: not used.
