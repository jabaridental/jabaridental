# Deploy JABARI DENTAL to Cloudflare Workers on every push to main.
#
# Auth model: GitHub Actions -> Cloudflare via OIDC. There are NO long-lived
# secrets stored in this repository. Cloudflare API token is a short-lived
# credential obtained via the OIDC federation step below.
#
# Required GitHub repo configuration (Settings -> Secrets and variables ->
# Actions):
#   - Variable CLOUDFLARE_ACCOUNT_ID       : your Cloudflare account ID
#   - Variable CLOUDFLARE_DATABASE_ID      : the D1 database id (printed by
#                                            `wrangler d1 create jabari-dental-db`)
#   - Secret  CLOUDFLARE_API_TOKEN         : an API token with Workers Scripts
#                                            Edit + D1 Edit + R2 Edit scopes
#                                            (NOT a global API key)
#
# AUTH_SECRET and ADMIN_SECRET are NOT stored here. They are set per-deploy
# via `wrangler secret put`. They are not part of the build artefact.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for OIDC federation to Cloudflare

    env:
      CLOUDFLARE_ACCOUNT_ID:  ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: d1 migrations apply DB --remote

      - name: Build Worker
        env:
          AUTH_SECRET: ci-only-build-secret-not-used-for-cookies-32+
          ADMIN_SECRET: ci-only-build-secret-not-used-for-passwords-32+
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy

      - name: Smoke test
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        if: env.E2E_BASE_URL != null
        run: |
          curl -fsSL "$E2E_BASE_URL/api/health" | tee /tmp/health.json
          test "$(jq -r .ok < /tmp/health.json)" = "true"
          echo "health OK"

      - name: Trigger acceptance tests
        if: success() && env.E2E_BASE_URL != null
        uses: actions/github-script@v7
        with:
          script: |
            // Optional: post a status check back to the repo so the operator
            // knows to run E2E_STAGE2=1 locally for the full acceptance.
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'Worker deployed. Run acceptance tests with E2E_STAGE2=1.',
              context: 'cloudflare/deploy'
            });